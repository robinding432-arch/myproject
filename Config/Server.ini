; ============================================================
;  StellarSystem Server Configuration
;  ============================================================
;  此文件由 Dedicated Server 自动读取
;  修改后需重启服务器生效
;  ============================================================

[/Script/StellarSystem.StellarDedicatedServer]
; ---- 基本设置 ----
ServerName="StellarSystem Official Server"
MOTD="Welcome to the StellarSystem universe! Explore, trade, survive."
MaxPlayers=32
Port=7777

; ---- 安全 ----
EnableAntiCheat=true
RequiredClientVersion="6.7.0"

; ---- 游戏玩法 ----
EnablePvP=true
GalaxySeed=0                  ; 0 = 随机生成
AutoSaveInterval=300.0         ; 秒（5 分钟）
NetworkTickRate=30.0           ; Hz（1-60）
RelevancyDistance=50000         ; cm
AllowMods=false

; ---- 性能 ----
; NetworkTickRate 越高 → 越流畅但带宽越大
; 推荐：
;   10  → 低带宽（手机热点）
;   20  → 普通宽带
;   30  → 推荐
;   60  → 高性能服务器

; ---- 高级 ----
; LogLevel=3                    ; 0=Error 1=Warn 2=Log 3=Verbose
; MaxMemoryMB=4096              ; 超过后触发 GC
; ShutdownDelay=10              ; 关闭延迟秒数

; ============================================================
;  封禁列表（自动维护，勿手动编辑）
;  ============================================================
; [/Script/StellarSystem.BannedPlayers]
; BannedIDs=()
