; DefaultMobile.ini
; v7.2 — Mobile default settings (shared Android + iOS)

[/Script/StellarSystem.MobilePerformanceProfile]
; Auto-detected at runtime; these are fallbacks
QualityTier=1
bAutoDetect=True
bEnableDynamicResolution=True
bEnableThermalMonitoring=True
bEnableAutoDowngrade=True

[/Script/StellarSystem.MobileUIScaler]
ReferenceResolutionX=1920
ReferenceResolutionY=1080
MinScale=0.6
MaxScale=1.8
ScaleCurve=1.15
FontScale=1.0
IconScale=1.0
MinTouchTarget=48
bAutoRotate=True
bPreferLandscape=True

[/Script/StellarSystem.MobileLODManager]
DefaultStrategy=1
bAutoRegisterActors=True
bCullParticles=True
bCullLights=True
MaxTrianglesWarning=500000
MaxDrawCallsWarning=2000

[/Script/StellarSystem.MobileNetworkAdapter]
DefaultTickRate=15
bEnableCompression=True
bBatchPackets=True
MaxBatchSize=1024
BackgroundKeepAlive=30.0
BackgroundTimeout=60.0
MaxReconnectAttempts=5
ReconnectDelay=3.0
bDataSaverMode=False
DataSaverKbPerMin=100
bDisableVoiceInDataSaver=True
bSkipCosmeticReplication=True

[/Script/StellarSystem.TouchInputManager]
LeftDeadZone=0.15
RightDeadZone=0.1
DoubleTapTime=0.3
LongPressTime=0.6
SwipeMinDistance=50.0
PinchMinDelta=20.0
bAdaptiveJoystick=True
bHapticFeedback=True

[/Script/Engine.InputSettings]
bEnableTouchInterface=True
bEnableMouseOverEvents=False
bEnableTouchOverEvents=True
bAlwaysShowTouchInterface=True
DefaultTouchInterface=/Engine/MobileResources/HUD/DefaultTouchInterface.DefaultTouchInterface
